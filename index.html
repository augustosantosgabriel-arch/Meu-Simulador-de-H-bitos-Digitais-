<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Tempo nas Redes Sociais</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Análise de Tempo nas Redes Sociais</h1>
        
        <label for="horas">Quantas horas você passa nas redes sociais por dia?</label>
        <input type="number" id="horas" min="0" max="24" placeholder="Ex: 5">
        
        <button id="btnCalcular">Calcular Tempo</button>
        
        <div id="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
